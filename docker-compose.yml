name: voix-de-sagesse

services:
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  backend:
    build: ./backend
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      MONGODB_URI: mongodb://mongo:27017/voixdesagesse
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is missing from .env (see .env.example)}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      DEMO_DATA: ${DEMO_DATA:-true}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Demo1234!}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"

volumes:
  mongo_data:
  uploads:
