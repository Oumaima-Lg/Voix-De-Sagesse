# Messages returned to the client for VoixDeSagesseException keys (UTF-8).
# Their HTTP status is set in GlobalExceptionHandler (400 when not listed).
USER_FOUND=Un compte existe déjà avec cet email.
USER_NOT_FOUND=Utilisateur introuvable.
INVALID_CREDENTIALS=Email ou mot de passe incorrect.
LOGIN_BLOCKED=Trop de tentatives de connexion. Réessayez dans 15 minutes.
OTP_NOT_FOUND=Le code a expiré. Demandez un nouveau code.
OTP_INCORRECT=Code incorrect.
OTP_TOO_SOON=Veuillez patienter une minute avant de demander un nouveau code.
OTP_TOO_MANY_ATTEMPTS=Trop de tentatives. Demandez un nouveau code.
MAIL_FAILED=L'email n'a pas pu être envoyé. Réessayez dans quelques minutes.
RESET_TOKEN_INVALID=La demande de réinitialisation est invalide ou a expiré. Recommencez la procédure.
ARTICLE_NOT_FOUND=Article introuvable.
COMMENT_NOT_FOUND=Commentaire introuvable.
SIGNAL_NOT_FOUND=Signalement introuvable.
COMMENT_DELETE_FORBIDDEN=Vous n'êtes pas autorisé à supprimer ce commentaire.
COMMENT_EMPTY=Le commentaire ne peut pas être vide.
COMMENT_TOO_LONG=Le commentaire ne peut pas dépasser 500 caractères.
ALREADY_LIKED=Vous aimez déjà cet article.
NOT_LIKED=Vous n'aimez pas encore cet article.
ALREADY_SAVED=Cet article est déjà dans vos favoris.
NOT_SAVED=Cet article n'est pas dans vos favoris.
ALREADY_FOLLOWING=Vous suivez déjà cet utilisateur.
NOT_FOLLOWING=Vous ne suivez pas cet utilisateur.
SELF_FOLLOW=Vous ne pouvez pas vous abonner à vous-même.
ALREADY_REPORTED=Vous avez déjà signalé cet article.
FILE_EMPTY=Aucun fichier sélectionné.
FILE_TYPE_NOT_ALLOWED=Format non accepté. Formats acceptés : JPEG, PNG, GIF, WebP.
