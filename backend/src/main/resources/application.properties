spring.application.name=VoixDeSagesse

# Every value that changes between environments comes from an environment variable.
# The defaults below are meant for local development; see .env.example at the repository root.

# --- Server
server.port=${PORT:8080}
# Trust X-Forwarded-* headers only from the hosting provider's internal proxies
server.forward-headers-strategy=native

# --- MongoDB
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/voixdesagesse}
spring.data.mongodb.auto-index-creation=true

# --- Security
# Required, at least 32 bytes: the application refuses to start otherwise
jwt.secret=${JWT_SECRET}
# Token lifetime in milliseconds (24 hours)
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
# Comma-separated list of frontend origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Email (SMTP). Defaults target Mailpit, a local mail catcher.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@voixdesagesse.local}

# --- Profile picture uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=${UPLOAD_DIR:uploads/profile-pictures}

# --- Health check for the hosting platform (GET /actuator/health)
management.endpoints.web.exposure.include=health
# An email outage must not mark the app as down (the platform would restart it)
management.health.mail.enabled=false

# --- API documentation (/swagger-ui.html), public on purpose so the API can be browsed
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# --- Demo data: accounts and articles created at startup when the database is empty
app.demo-data.enabled=${DEMO_DATA:false}
# Password of demo@voixdesagesse.local and of the demo authors
app.demo-data.user-password=${DEMO_USER_PASSWORD:Demo1234!}
# Password of admin@voixdesagesse.local; when empty, no admin account is created
app.demo-data.admin-password=${DEMO_ADMIN_PASSWORD:}
