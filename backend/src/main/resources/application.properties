spring.application.name=VoixDeSagesse

server.port=${PORT:8080}
server.forward-headers-strategy=native

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/voixdesagesse}
spring.data.mongodb.auto-index-creation=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@voixdesagesse.local}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.pictures.storage=${PICTURE_STORAGE:local}
app.pictures.upload-dir=${UPLOAD_DIR:uploads/profile-pictures}
app.pictures.cloudinary-url=${CLOUDINARY_URL:}

app.rate-limit.email-codes-per-hour=${EMAIL_CODES_PER_HOUR:5}
app.rate-limit.picture-uploads-per-hour=${PICTURE_UPLOADS_PER_HOUR:10}
app.client-ip-header=${CLIENT_IP_HEADER:}

management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

app.demo-data.enabled=${DEMO_DATA:false}
app.demo-data.user-password=${DEMO_USER_PASSWORD:Demo1234!}
app.demo-data.admin-password=${DEMO_ADMIN_PASSWORD:}
